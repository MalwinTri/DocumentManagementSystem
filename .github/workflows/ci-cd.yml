name: CI/CD Pipeline

on:
  pull_request:
    branches: ["master", "CI_CD_Pipeline"]
  push:
    branches: ["master", "CI_CD_Pipeline"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: "8.0.x"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/dms
  ConnectionStrings__Default: Host=localhost;Port=5433;Database=${{ secrets.CI_DB_NAME }};Username=${{ secrets.CI_DB_USER }};Password=${{ secrets.CI_DB_PASSWORD }}
  GarageS3__Endpoint: http://garage:3900  # Garage als Hostname verwenden
  GarageS3__AccessKey: ${{ secrets.CI_S3_ACCESS_KEY }}
  GarageS3__SecretKey: ${{ secrets.CI_S3_SECRET_KEY }}
  GarageS3__Bucket: ${{ secrets.CI_S3_BUCKET }}
  GarageS3__Region: ${{ secrets.CI_S3_REGION }}
  RABBIT_HOST: ${{ secrets.RABBIT_HOST }}
  RABBIT_USER: ${{ secrets.RABBIT_USER }}
  RABBIT_PASS: ${{ secrets.RABBIT_PASS }}
  RABBIT_QUEUE: ${{ secrets.RABBIT_QUEUE }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.CI_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.CI_DB_NAME }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dms"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      garage:
        image: dxflrs/garage:v2.1.0
        ports:
          - 3900:3900
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 15672:15672
          - 5672:5672

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      # -----------------------
      # WAIT FOR GARAGE (before tests)
      # -----------------------
      - name: Wait for Garage
        run: |
          for i in {1..30}; do
            if curl -sSf http://garage:3900 >/dev/null; then
              echo "Garage is up"
              exit 0
            fi
            echo "Garage not ready yet... ($i/30)"
            sleep 2
          done
          echo "Garage did not become ready in time"
          exit 1

      # -----------------------
      # Debug env (Garage)
      # -----------------------
      - name: Debug env (Garage)
        run: |
          echo "GarageS3__Endpoint=$GarageS3__Endpoint"
          printenv | grep -i garage || true

      # -----------------------
      # RUN INTEGRATION TESTS
      # -----------------------
      - name: Integration Tests
        env:
          ConnectionStrings__Default: Host=localhost;Port=5433;Database=${{ secrets.CI_DB_NAME }};Username=${{ secrets.CI_DB_USER }};Password=${{ secrets.CI_DB_PASSWORD }}

          # Garage Service in GitHub Actions: NICHT localhost!
          GarageS3__Endpoint: http://garage:3900
          GarageS3__AccessKey: ${{ secrets.CI_S3_ACCESS_KEY }}
          GarageS3__SecretKey: ${{ secrets.CI_S3_SECRET_KEY }}
          GarageS3__Bucket: ${{ secrets.CI_S3_BUCKET }}
          GarageS3__Region: ${{ secrets.CI_S3_REGION }}

          # Falls AWS SDK "ServiceURL" irgendwo anders gezogen wird:
          AWS_ENDPOINT_URL: http://garage:3900
          AWS_REGION: ${{ secrets.CI_S3_REGION }}

          RABBIT_HOST: rabbitmq
          RABBIT_USER: guest
          RABBIT_PASS: guest
          RABBIT_QUEUE: ocr-queue
        run: dotnet test ./DocumentManagementSystem.IntegrationTests/DocumentManagementSystem.IntegrationTests.csproj -c Release --no-build --verbosity normal
