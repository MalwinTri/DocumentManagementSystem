name: CI/CD

on:
  pull_request:
    branches: [ "master", "CI_CD_Pipeline" ]
  push:
    branches: [ "master", "CI_CD_Pipeline" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: "8.0.x"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/dms

jobs:
  build-lint-test:
    name: Build, Lint & Test (.NET)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dms
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dms"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # -----------------------
      # LINTING (dotnet format)
      # -----------------------
      - name: Install dotnet format
        run: dotnet tool install --global dotnet-format

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Lint (dotnet format)
        run: dotnet format --verify-no-changes --verbosity minimal

      # -----------------------
      # TESTS
      # -----------------------
      - name: Test
        env:
          ConnectionStrings__Default: Host=localhost;Port=5433;Database=${{ secrets.CI_DB_NAME }};Username=${{ secrets.CI_DB_USER }};Password=${{ secrets.CI_DB_PASSWORD }}
        run: |
          dotnet test ./DocumentManagementSystem.Tests/DocumentManagementSystem.Tests.csproj -c Release --no-build --verbosity normal
          dotnet test ./DocumentManagementSystem.IntegrationTests/DocumentManagementSystem.IntegrationTests.csproj -c Release --no-build --verbosity normal


  docker-build-push:
    name: Docker Build & Push (master only)
    runs-on: ubuntu-latest
    needs: build-lint-test
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./DocumentManagementSystem/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}

      - name: Build & Push OCR Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./OCR_Worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ocr:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ocr:${{ github.sha }}

      - name: Build & Push GenAI Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./DocumentManagementSystem.GenAI_Worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-genai:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-genai:${{ github.sha }}

      - name: Build & Push AccessBatch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./DocumentManagementSystem.AccessBatch/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-accessbatch:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-accessbatch:${{ github.sha }}
