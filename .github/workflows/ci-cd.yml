name: CI/CD

on:
  pull_request:
    branches: ["master", "CI_CD_Pipeline"]
  push:
    branches: ["master", "CI_CD_Pipeline"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: "8.0.x"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/dms

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.CI_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.CI_DB_NAME }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Ensure AWS CLI v2
        run: |
          set -euxo pipefail
          if command -v aws >/dev/null 2>&1; then
            aws --version
          else
            sudo apt-get update
            sudo apt-get install -y unzip curl
            curl -sS "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install
            aws --version
          fi

      # -----------------------
      # Start Garage (S3) - fixed for v2.1.0 (rpc_secret required)
      # -----------------------
      - name: Start Garage (S3)
        env:
          GARAGE_S3_ENDPOINT: http://localhost:3900
          GARAGE_BUCKET: ${{ secrets.CI_S3_BUCKET }}
          GARAGE_KEY_NAME: ci-key
        run: |
          set -euxo pipefail

          docker rm -f garage >/dev/null 2>&1 || true
          mkdir -p .ci/garage/meta .ci/garage/data

          # Generate required RPC secret for Garage v2.1.0
          RPC_SECRET="$(openssl rand -hex 32)"

          # IMPORTANT for Garage v2.1.0:
          # - rpc_bind_addr and rpc_secret must be at ROOT level
          cat > .ci/garage/garage.toml <<TOML
          replication_factor = 1

          metadata_dir = "/var/lib/garage/meta"
          data_dir = "/var/lib/garage/data"
          rpc_secret = "${RPC_SECRET}"
          rpc_bind_addr = "[::]:3901"
          api_key = "garage-access-key"
          api_secret = "garage-secret-key"

          [s3_api]
          api_bind_addr = "[::]:3900"
          s3_region = "garage"

          [admin]
          api_bind_addr = "[::]:3903"
          TOML

          docker run -d --name garage \
            -p 3900:3900 -p 3901:3901 -p 3903:3903 \
            -v "$PWD/.ci/garage/garage.toml:/etc/garage.toml:ro" \
            -v "$PWD/.ci/garage/meta:/var/lib/garage/meta" \
            -v "$PWD/.ci/garage/data:/var/lib/garage/data" \
            -e GARAGE_CONFIG_FILE=/etc/garage.toml \
            dxflrs/garage:v2.1.0

          # Wait until /garage status works
          for i in {1..120}; do
            if ! docker ps --format '{{.Names}}' | grep -qx garage; then
              echo "Garage container exited/crashed. Logs:"
              docker logs garage --tail 300 || true
              exit 1
            fi

            if docker exec garage /garage status >/dev/null 2>&1; then
              echo "Garage is up."
              break
            fi

            echo "Waiting for Garage... ($i/120)"
            docker logs garage --tail 80 || true
            sleep 1
          done

          echo "--- garage status ---"
          docker exec garage /garage status || true
          echo "--- garage logs (tail) ---"
          docker logs garage --tail 200 || true

          NODE_ID="$(docker exec garage /garage status | grep -Eo '[a-f0-9]{8,}' | head -n 1 || true)"
          if [ -z "$NODE_ID" ]; then
            echo "Could not detect NODE_ID from /garage status"
            docker exec garage /garage status || true
            docker logs garage --tail 300 || true
            exit 1
          fi
          echo "NODE_ID=$NODE_ID"

          # Assign + apply layout (so node is not "NO ROLE ASSIGNED")
          docker exec garage /garage layout assign -z dc1 -c 1G "$NODE_ID"
          yes | docker exec -i garage /garage layout apply
          docker exec garage /garage layout show || true

          # Create keypair
          KEY_OUT="$(docker exec garage /garage key create "$GARAGE_KEY_NAME")"
          echo "$KEY_OUT"

          ACCESS_KEY="$(printf "%s\n" "$KEY_OUT" | sed -n 's/^[[:space:]]*Key ID:[[:space:]]*//p' | head -n 1 | tr -d '\r')"
          SECRET_KEY="$(printf "%s\n" "$KEY_OUT" | sed -n 's/^[[:space:]]*Secret key:[[:space:]]*//p' | head -n 1 | tr -d '\r')"

          if [ -z "$ACCESS_KEY" ] || [ -z "$SECRET_KEY" ]; then
            echo "Failed to parse Key ID / Secret key."
            exit 1
          fi

          # Bucket + permissions
          docker exec garage /garage bucket create "$GARAGE_BUCKET" || true
          docker exec garage /garage bucket allow --read --write --owner "$GARAGE_BUCKET" --key "$GARAGE_KEY_NAME"

          # Export env for later steps
          {
            echo "GARAGE_S3_ENDPOINT=$GARAGE_S3_ENDPOINT"
            echo "GARAGE_BUCKET=$GARAGE_BUCKET"
            echo "GARAGE_ACCESS_KEY=$ACCESS_KEY"
            echo "GARAGE_SECRET_KEY=$SECRET_KEY"
            echo "AWS_ACCESS_KEY_ID=$ACCESS_KEY"
            echo "AWS_SECRET_ACCESS_KEY=$SECRET_KEY"
            echo "AWS_DEFAULT_REGION=garage"
          } >> "$GITHUB_ENV"

          # Sanity checks
          aws --endpoint-url "$GARAGE_S3_ENDPOINT" s3 ls || true
          aws --endpoint-url "$GARAGE_S3_ENDPOINT" s3 ls "s3://$GARAGE_BUCKET" || true

      - name: Install dotnet format
        run: dotnet tool install -g dotnet-format

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Lint (dotnet format)
        run: dotnet format --verify-no-changes --verbosity minimal

      - name: Unit Tests (exclude OCR smoke)
        run: dotnet test ./DocumentManagementSystem.Tests/DocumentManagementSystem.Tests.csproj -c Release --no-build --verbosity normal --filter "Category!=OcrSmoke"

      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5433 -U "${{ secrets.CI_DB_USER }}" -d "${{ secrets.CI_DB_NAME }}" && exit 0
            echo "Postgres not ready yet... ($i/30)"
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Wait for RabbitMQ
        run: |
          for i in {1..30}; do
            curl --silent --fail http://localhost:15672 >/dev/null && exit 0
            echo "RabbitMQ not ready yet... ($i/30)"
            sleep 2
          done
          echo "RabbitMQ did not become ready in time"
          exit 1

      - name: Integration Tests
        env:
          ConnectionStrings__Default: Host=localhost;Port=5433;Database=${{ secrets.CI_DB_NAME }};Username=${{ secrets.CI_DB_USER }};Password=${{ secrets.CI_DB_PASSWORD }}
          GarageS3__Endpoint: ${{ env.GARAGE_S3_ENDPOINT }}
          GarageS3__AccessKey: ${{ env.GARAGE_ACCESS_KEY }}
          GarageS3__SecretKey: ${{ env.GARAGE_SECRET_KEY }}
          GarageS3__Bucket: ${{ env.GARAGE_BUCKET }}
          GarageS3__Region: garage
          RABBIT_HOST: localhost
          RABBIT_USER: guest
          RABBIT_PASS: guest
          RABBIT_QUEUE: ocr-queue
        run: dotnet test ./DocumentManagementSystem.IntegrationTests/DocumentManagementSystem.IntegrationTests.csproj -c Release --no-build --verbosity normal

      - name: Debug containers (always)
        if: always()
        run: |
          docker ps -a
          docker logs garage --tail 300 || true

  docker-build-push:
    name: Docker Build & Push (master / CI_CD_Pipeline)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/CI_CD_Pipeline'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./DocumentManagementSystem/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}

      - name: Build & Push OCR Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./OCR_Worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ocr:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ocr:${{ github.sha }}

      - name: Build & Push GenAI Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./DocumentManagementSystem.GenAI_Worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-genai:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-genai:${{ github.sha }}

      - name: Build & Push AccessBatch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./DocumentManagementSystem.AccessBatch/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-accessbatch:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-accessbatch:${{ github.sha }}
