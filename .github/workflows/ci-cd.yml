name: CI/CD

on:
  pull_request:
    branches: ["master", "CI_CD_Pipeline"]
  push:
    branches: ["master", "CI_CD_Pipeline"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: "8.0.x"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/dms

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.CI_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.CI_DB_NAME }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dms"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      garage:
        image: dxflrs/garage:v2.1.0
        ports:
          - 3900:3900

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # -----------------------
      # LINTING (dotnet format)
      # -----------------------
      - name: Install dotnet format
        run: dotnet tool install -g dotnet-format

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Lint (dotnet format)
        run: dotnet format --verify-no-changes --verbosity minimal

      # -----------------------
      # Unit Tests (exclude OCR smoke)
      # -----------------------
      - name: Unit Tests (exclude OCR smoke)
        run: dotnet test ./DocumentManagementSystem.Tests/DocumentManagementSystem.Tests.csproj -c Release --no-build --verbosity normal --filter "Category!=OcrSmoke"

      # -----------------------
      # Wait for Postgres (optional extra safety)
      # -----------------------
      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5433 -U "${{ secrets.CI_DB_USER }}" -d "${{ secrets.CI_DB_NAME }}" && exit 0
            echo "Postgres not ready yet... ($i/30)"
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      # -----------------------
      # Wait for Garage service using AWS CLI
      # -----------------------
      - name: Wait for Garage service
        run: |
          for i in {1..30}; do
            aws --endpoint-url http://garage:3900 s3 ls --no-verify-ssl && exit 0
            echo "Garage not ready yet... ($i/30)"
            sleep 5
          done
          echo "Garage did not become ready in time"
          exit 1

      # -----------------------
      # Wait for RabbitMQ
      # -----------------------
      - name: Wait for RabbitMQ
        run: |
          for i in {1..30}; do
            curl --silent --fail http://rabbitmq:15672/api/health && exit 0
            echo "RabbitMQ not ready yet... ($i/30)"
            sleep 2
          done
          echo "RabbitMQ did not become ready in time"
          exit 1

      # -----------------------
      # Integration Tests
      # -----------------------
      - name: Integration Tests
        env:
          ConnectionStrings__Default: Host=localhost;Port=5433;Database=${{ secrets.CI_DB_NAME }};Username=${{ secrets.CI_DB_USER }};Password=${{ secrets.CI_DB_PASSWORD }}
          GarageS3__Endpoint: http://garage:3900
          GarageS3__AccessKey: ${{ secrets.CI_S3_ACCESS_KEY }}
          GarageS3__SecretKey: ${{ secrets.CI_S3_SECRET_KEY }}
          GarageS3__Bucket: ${{ secrets.CI_S3_BUCKET }}
          GarageS3__Region: ${{ secrets.CI_S3_REGION }}
          RABBIT_HOST: rabbitmq
          RABBIT_USER: guest
          RABBIT_PASS: guest
          RABBIT_QUEUE: ocr-queue
        run: dotnet test ./DocumentManagementSystem.IntegrationTests/DocumentManagementSystem.IntegrationTests.csproj -c Release --no-build --verbosity normal
