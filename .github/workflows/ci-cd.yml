name: CI/CD

on:
  pull_request:
    branches: ["master", "CI_CD_Pipeline"]
  push:
    branches: ["master", "CI_CD_Pipeline"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: "8.0.x"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/dms

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.CI_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.CI_DB_NAME }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Ensure AWS CLI v2
        run: |
          set -euxo pipefail
          aws --version

      # -----------------------
      # Start Garage (single-node) + init layout + bucket + key
      # -----------------------
      - name: Start & Init Garage (S3)
        env:
          CI_GARAGE_ENDPOINT: http://localhost:3900
          CI_GARAGE_ADMIN: http://localhost:3903
          CI_S3_BUCKET: ${{ secrets.CI_S3_BUCKET }}
        run: |
          set -euxo pipefail

          # Clean up if rerun
          docker rm -f garage >/dev/null 2>&1 || true

          mkdir -p .ci/garage/{meta,data}

          # Minimal single-node config for Garage v2.x
          cat > .ci/garage/garage.toml <<'TOML'
          metadata_dir = "/var/lib/garage/meta"
          data_dir = "/var/lib/garage/data"
          db_engine = "lmdb"

          # required for v2.x
          replication_factor = 1
          rpc_bind_addr = "0.0.0.0:3901"
          rpc_public_addr = "127.0.0.1:3901"

          # any random secret (only for CI)
          rpc_secret = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

          [s3_api]
          api_bind_addr = "0.0.0.0:3900"
          s3_region = "garage"

          [admin]
          api_bind_addr = "0.0.0.0:3903"
          TOML

          # Run Garage with its default entrypoint/cmd
          docker run -d --name garage \
            -p 3900:3900 -p 3901:3901 -p 3903:3903 \
            -v "$PWD/.ci/garage/garage.toml:/etc/garage.toml:ro" \
            -v "$PWD/.ci/garage/meta:/var/lib/garage/meta" \
            -v "$PWD/.ci/garage/data:/var/lib/garage/data" \
            -e GARAGE_CONFIG_FILE=/etc/garage.toml \
            dxflrs/garage:v2.1.0

          # Wait until Garage responds
          for i in {1..60}; do
            if docker exec garage /garage status >/dev/null 2>&1; then
              echo "Garage is up."
              break
            fi
            echo "Waiting for Garage... ($i/60)"
            sleep 2
          done

          echo "--- garage status ---"
          docker exec garage /garage status || true
          echo "--- garage logs (tail) ---"
          docker logs garage --tail 200 || true

          # Layout init (required!)
          # Extract node id from status output (first ID-looking token)
          NODE_ID="$(docker exec garage /garage status | grep -Eo '[a-f0-9]{8,}' | head -n 1 || true)"
          if [ -z "$NODE_ID" ]; then
            echo "Could not extract NODE_ID from 'garage status'"
            exit 1
          fi
          echo "NODE_ID=$NODE_ID"

          # Assign 1G capacity in zone dc1, then apply (pipe yes to avoid prompt)
          docker exec garage /garage layout assign -z dc1 -c 1G "$NODE_ID"
          yes | docker exec -i garage /garage layout apply

          # Create bucket + key, allow RW+owner
          docker exec garage /garage bucket create "$CI_S3_BUCKET" || true
          docker exec garage /garage key create ci-key || true
          docker exec garage /garage bucket allow "$CI_S3_BUCKET" --read --write --owner --key ci-key

          # Read credentials
          INFO="$(docker exec garage /garage key info ci-key --show-secret)"
          echo "$INFO"

          ACCESS_KEY="$(echo "$INFO" | awk -F': ' '/Key ID/ {print $2}' | head -n1)"
          SECRET_KEY="$(echo "$INFO" | awk -F': ' '/Secret key/ {print $2}' | head -n1)"

          if [ -z "$ACCESS_KEY" ] || [ -z "$SECRET_KEY" ]; then
            echo "Failed to parse Garage key credentials."
            exit 1
          fi

          # Export for later steps (AWS CLI + Integration tests)
          {
            echo "AWS_ACCESS_KEY_ID=$ACCESS_KEY"
            echo "AWS_SECRET_ACCESS_KEY=$SECRET_KEY"
            echo "AWS_DEFAULT_REGION=garage"
            echo "GARAGE_ENDPOINT=$CI_GARAGE_ENDPOINT"
            echo "GARAGE_BUCKET=$CI_S3_BUCKET"
          } >> "$GITHUB_ENV"

          # Quick S3 check
          aws --endpoint-url "$CI_GARAGE_ENDPOINT" s3 ls || true
          aws --endpoint-url "$CI_GARAGE_ENDPOINT" s3 ls "s3://$CI_S3_BUCKET" || true

      # -----------------------
      # LINTING (dotnet format)
      # -----------------------
      - name: Install dotnet format
        run: dotnet tool install -g dotnet-format

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Lint (dotnet format)
        run: dotnet format --verify-no-changes --verbosity minimal

      # -----------------------
      # Unit Tests
      # -----------------------
      - name: Unit Tests (exclude OCR smoke)
        run: dotnet test ./DocumentManagementSystem.Tests/DocumentManagementSystem.Tests.csproj -c Release --no-build --verbosity normal --filter "Category!=OcrSmoke"

      # -----------------------
      # Wait for Postgres
      # -----------------------
      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5433 -U "${{ secrets.CI_DB_USER }}" -d "${{ secrets.CI_DB_NAME }}" && exit 0
            echo "Postgres not ready yet... ($i/30)"
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      # -----------------------
      # Wait for RabbitMQ
      # -----------------------
      - name: Wait for RabbitMQ
        run: |
          for i in {1..30}; do
            curl --silent --fail http://localhost:15672 >/dev/null && exit 0
            echo "RabbitMQ not ready yet... ($i/30)"
            sleep 2
          done
          echo "RabbitMQ did not become ready in time"
          exit 1

      # -----------------------
      # Integration Tests
      # -----------------------
      - name: Integration Tests
        env:
          ConnectionStrings__Default: Host=localhost;Port=5433;Database=${{ secrets.CI_DB_NAME }};Username=${{ secrets.CI_DB_USER }};Password=${{ secrets.CI_DB_PASSWORD }}
          GarageS3__Endpoint: ${{ env.GARAGE_ENDPOINT }}
          GarageS3__AccessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          GarageS3__SecretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          GarageS3__Bucket: ${{ env.GARAGE_BUCKET }}
          GarageS3__Region: garage
          RABBIT_HOST: localhost
          RABBIT_USER: guest
          RABBIT_PASS: guest
          RABBIT_QUEUE: ocr-queue
        run: dotnet test ./DocumentManagementSystem.IntegrationTests/DocumentManagementSystem.IntegrationTests.csproj -c Release --no-build --verbosity normal

      - name: Debug containers (always)
        if: always()
        run: |
          docker ps -a
          docker logs garage --tail 200 || true

  docker-build-push:
    name: Docker Build & Push (master / CI_CD_Pipeline)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/CI_CD_Pipeline'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./DocumentManagementSystem/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}

      - name: Build & Push OCR Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./OCR_Worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ocr:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ocr:${{ github.sha }}

      - name: Build & Push GenAI Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./DocumentManagementSystem.GenAI_Worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-genai:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-genai:${{ github.sha }}

      - name: Build & Push AccessBatch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./DocumentManagementSystem.AccessBatch/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-accessbatch:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-accessbatch:${{ github.sha }}
